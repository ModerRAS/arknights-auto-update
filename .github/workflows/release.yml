name: Release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "可选标签 vX.Y.Z，必须与 Cargo.toml 版本一致；留空则使用 Cargo.toml 版本"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      reason: ${{ steps.plan.outputs.reason }}
      retarget: ${{ steps.plan.outputs.retarget }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: bash scripts/resolve-release.sh

  verify:
    name: verify
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust checks
        uses: ./.github/actions/rust-ci

  publish:
    name: publish
    needs: [plan, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Point version tag at this commit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin master --tags --force --quiet
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            remote_head="$(git rev-parse refs/remotes/origin/master)"
            if [[ "$remote_head" != "$SHA" ]]; then
              echo "master 已前进到 ${remote_head}，取消这次过期的发布。" >&2
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}^{}" >/dev/null; then
            current="$(git rev-parse "refs/tags/${TAG}^{}")"
            if [[ "$current" != "$SHA" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f "$TAG" "$SHA"
              git push --force origin "refs/tags/${TAG}"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          make_latest: "true"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.target }})
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ARK_UPDATER_GIT_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm release tag
        id: confirm
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          current="$(git rev-parse "refs/tags/${TAG}^{}")"
          if [[ "$current" == "$SHA" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "标签 ${TAG} 指向 ${current}，当前提交是 ${SHA}，跳过上传。"
          fi

      - name: Cache cargo
        if: steps.confirm.outputs.upload == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build and upload
        if: steps.confirm.outputs.upload == 'true'
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ark-updater
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          include: LICENSE,README.md,config.example.toml
          leading-dir: true
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ needs.plan.outputs.tag }}
