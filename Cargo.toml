[package]
name = "ark-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "明日方舟官服自动更新器：WebUI、多设备并发安装、自动拉起模拟器"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures = "0.3"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
tower-http = { version = "0.6.11", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
